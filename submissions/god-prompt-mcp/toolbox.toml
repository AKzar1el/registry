[tool]
name = "god-prompt-mcp"
version = "1.0.33"
description = "Local MCP server for GodPrompt software-engineering workflow guidance, including task routing, TDD, debugging protocols, verification gates, and progressive disclosure."
author = "Tomi Šeregi"
homepage = "https://tomiseregi.si/projects/god-prompt"
repository = "https://github.com/AKzar1el/god-prompt-mcp"
license = "MIT"

[binary]
entry = "god-prompt-mcp"
platforms = ["darwin-arm64", "darwin-x64", "linux-x64", "windows-x64"]

[runtime]
transport = "stdio"

[permissions]
filesystem = false
network = false
allow_exec = false
env_vars = []
max_memory_mb = 256
max_cpu_percent = 50

[distribution]
package = "github:AKzar1el/god-prompt-mcp#f5ee3b70a96625eab4cde04325fdaac62efab857"
install = "npx -y github:AKzar1el/god-prompt-mcp#f5ee3b70a96625eab4cde04325fdaac62efab857"
binary_url = "https://github.com/AKzar1el/god-prompt-mcp/releases/download/v1.0.33/god-prompt-mcp-1.0.33.mcpb"
sha512 = ""

[[mcp.tools]]
name = "get_god_prompt"
description = "Return the complete bundled GodPrompt single-file payload."

[[mcp.tools]]
name = "get_core_skill"
description = "Return the bundled GodPrompt core skill and universal execution protocol."

[[mcp.tools]]
name = "get_protocols"
description = "Return the bundled deep execution protocols for supported software-engineering task types."

[[mcp.tools]]
name = "get_gates"
description = "Return the bundled verification checklists and completion gates."

[[mcp.tools]]
name = "get_anti_patterns"
description = "Return the bundled anti-patterns, red flags, and recovery guidance."

[[mcp.tools]]
name = "classify_task"
description = "Classify one concrete software-development task into one of GodPrompt's 9 task types (BUILD, DEBUG, REFACTOR, CONTENT, DESIGN, SHIP, ANALYZE, AUTOMATE, PLAN), or UNCLASSIFIED when no reliable route is detected. Returns JSON with task_type, deterministic confidence, protocol, matched_signals, alternative_task_types, ambiguous, and recommendation; use it for routing before loading detailed workflow text."

[[mcp.tools]]
name = "get_version"
description = "Returns JSON with the GodPrompt content version, MCP server version, repository, bundled file sizes and purposes, and task-type/protocol catalog. Use it to verify which GodPrompt content/server version a client is connected to; use the content retrieval tools when you need the actual workflow text."
